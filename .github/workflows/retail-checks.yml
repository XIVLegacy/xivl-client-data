name: Retail Checks

on:
  workflow_dispatch:

concurrency:
  group: retail-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retail-preflight:
    name: Retail Preflight Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      public_commit: ${{ steps.ref.outputs.public_commit }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Reject untrusted dispatch refs
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -z "${GITHUB_HEAD_REF:-}"
          test -z "${GITHUB_BASE_REF:-}"
          case "${GITHUB_REF}" in refs/pull/*|refs/merge/*) exit 1;; esac
          public_commit="$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "${public_commit}"
          remote_main="$(timeout 30s git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "${remote_main}"
          test "${remote_main}" = "${public_commit}"
          echo "public_commit=${public_commit}" >> "${GITHUB_OUTPUT}"

      - name: Verify the fixed public grant
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python tools/test_retail_staticactor.py
          timeout 30s python tools/verify_retail_staticactor.py \
            > "${RUNNER_TEMP}/asset-free-attestation.json"
          rm -f -- "${RUNNER_TEMP}/asset-free-attestation.json"

  staticactor:
    name: Static Actor Catalog Checks
    needs: retail-preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: retail-evidence
    steps:
      - name: Checkout approved public commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.retail-preflight.outputs.public_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Fetch the immutable private SAN blob
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          RETAIL_INPUTS_REPOSITORY: ${{ vars.RETAIL_INPUTS_REPOSITORY }}
          RETAIL_INPUTS_TOKEN: ${{ secrets.RETAIL_INPUTS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          private_root="${RUNNER_TEMP}/retail-evidence-private"
          api_root="${private_root}/api"
          game_root="${private_root}/game"
          auth_config="${private_root}/curl-auth.config"
          mkdir -p "${api_root}" "${game_root}/client/script"
          chmod 700 "${private_root}"
          trap 'rm -rf -- "${api_root}"; rm -f -- "${auth_config}"' EXIT

          repository="XIVLegacy/xivl-private-assets"
          commit="aeb52f6dbde95a793ee6d52be28de9f28a885b15"
          expected_path="client-data/ffxiv-1.23b/client/script/rq9q1797qvs.san"
          test "${RETAIL_INPUTS_REPOSITORY}" = "${repository}"
          test -n "${RETAIL_INPUTS_TOKEN}"
          printf 'header = "Authorization: Bearer %s"\n' \
            "${RETAIL_INPUTS_TOKEN}" > "${auth_config}"
          chmod 600 "${auth_config}"

          request() {
            local label="$1"
            local endpoint="$2"
            local output="$3"
            local http_status
            local curl_status

            set +e
            http_status="$(curl --silent --fail --location --max-time 180 \
              --max-filesize 30000000 \
              --config "${auth_config}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "${output}" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${repository}/${endpoint}" \
              2>> "${api_root}/curl.log")"
            curl_status=$?
            set -e

            if test "${curl_status}" -ne 0 || [[ "${http_status}" != 2?? ]]; then
              rm -f -- "${output}"
              printf 'Private API %s failed (curl %s, HTTP %s)\n' \
                "${label}" "${curl_status}" "${http_status}" >&2
              return 1
            fi
          }

          request commit "git/commits/${commit}" "${api_root}/commit.json"
          request compare "compare/${commit}...main" "${api_root}/compare.json"

          PRIVATE_ROOT="${private_root}" API_ROOT="${api_root}" \
          PINNED_COMMIT="${commit}" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          api = Path(os.environ["API_ROOT"])
          commit = os.environ["PINNED_COMMIT"]
          commit_doc = json.loads((api / "commit.json").read_text(encoding="utf-8"))
          compare_doc = json.loads((api / "compare.json").read_text(encoding="utf-8"))
          if commit_doc.get("sha") != commit:
              raise SystemExit("private commit identity failed")
          tree_sha = commit_doc.get("tree", {}).get("sha")
          if not isinstance(tree_sha, str) or len(tree_sha) != 40:
              raise SystemExit("private tree identity failed")
          if compare_doc.get("status") not in {"ahead", "identical"}:
              raise SystemExit("private commit reachability failed")
          if compare_doc.get("merge_base_commit", {}).get("sha") != commit:
              raise SystemExit("private commit reachability failed")
          (Path(os.environ["PRIVATE_ROOT"]) / "tree-sha").write_text(
              tree_sha + "\n", encoding="ascii"
          )
          PY

          IFS= read -r tree_sha < "${private_root}/tree-sha"
          request tree "git/trees/${tree_sha}?recursive=1" "${api_root}/tree.json"
          PRIVATE_ROOT="${private_root}" API_ROOT="${api_root}" \
          EXPECTED_PATH="${expected_path}" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_blobs = {
              "ffxivgame.exe": 15996808,
              "client-data/ffxiv-1.23b/client/script/rq9q1797qvs.san": 108911,
              "client-scripts/ffxiv-1.23b/client/script/7vxx9w6/39x5/89qqy57vxx9w689r57y9rr.le.lpb": 1507,
              "captures/pcap-1.23b/pcap-1.23b-objects.zip": 2622720,
          }
          expected_trees = {
              "/".join(path.split("/")[:depth])
              for path in expected_blobs
              for depth in range(1, len(path.split("/")))
          }
          tree = json.loads((Path(os.environ["API_ROOT"]) / "tree.json").read_text(encoding="utf-8"))
          entries = tree.get("tree")
          expected_tree = (Path(os.environ["PRIVATE_ROOT"]) / "tree-sha").read_text(
              encoding="ascii"
          ).strip()
          if tree.get("sha") != expected_tree or tree.get("truncated") is not False:
              raise SystemExit("private tree identity failed")
          if not isinstance(entries, list):
              raise SystemExit("private tree shape failed")
          by_path = {entry.get("path"): entry for entry in entries}
          if len(by_path) != len(entries) or set(by_path) != set(expected_blobs) | expected_trees:
              raise SystemExit("private tree shape failed")
          for path, size in expected_blobs.items():
              entry = by_path[path]
              if entry.get("type") != "blob" or entry.get("mode") != "100644" or entry.get("size") != size:
                  raise SystemExit("private tree entry failed")
          for path in expected_trees:
              entry = by_path[path]
              if entry.get("type") != "tree" or entry.get("mode") != "040000":
                  raise SystemExit("private tree entry failed")
          blob_sha = by_path[os.environ["EXPECTED_PATH"]].get("sha")
          if not isinstance(blob_sha, str) or len(blob_sha) != 40:
              raise SystemExit("private blob identity failed")
          (Path(os.environ["PRIVATE_ROOT"]) / "blob-sha").write_text(
              blob_sha + "\n", encoding="ascii"
          )
          PY

          IFS= read -r blob_sha < "${private_root}/blob-sha"
          request blob "git/blobs/${blob_sha}" "${api_root}/blob.json"
          API_ROOT="${api_root}" INPUT_ROOT="${game_root}" \
          BLOB_SHA="${blob_sha}" timeout 30s python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          document = json.loads((Path(os.environ["API_ROOT"]) / "blob.json").read_text(encoding="utf-8"))
          if document.get("sha") != os.environ["BLOB_SHA"]:
              raise SystemExit("private blob identity failed")
          if document.get("size") != 108911 or document.get("encoding") != "base64":
              raise SystemExit("private blob identity failed")
          content = "".join(document.get("content", "").split())
          try:
              data = base64.b64decode(content, validate=True)
          except (ValueError, TypeError):
              raise SystemExit("private blob encoding failed")
          if len(data) != 108911:
              raise SystemExit("private blob size failed")
          target = Path(os.environ["INPUT_ROOT"]) / "client/script/rq9q1797qvs.san"
          target.write_bytes(data)
          PY

      - name: Verify private SAN identity
        id: identity
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/retail-evidence-private/game/client/script/rq9q1797qvs.san"
          test "$(stat --format=%s "${input}")" = "108911"
          test "$(sha256sum "${input}" | cut -d ' ' -f 1)" = \
            "bb7306461b1728493242016a16d9dd5257d7512c60e423b017de5ec7aced3d14"

      - name: Reproduce and verify static-actor catalog
        id: analysis
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_root="${RUNNER_TEMP}/retail-evidence-private"
          safe_root="${GITHUB_WORKSPACE}/_safe"
          product="${private_root}/staticactor_class_paths.json"
          mutated="${private_root}/staticactor_class_paths-mutated.json"
          rm -rf -- "${safe_root}"
          mkdir -p "${safe_root}"

          timeout 120s python tools/extract_staticactor_san.py \
            "${private_root}/game" --out "${product}" \
            > "${private_root}/extract.log" 2>&1
          timeout 30s python tools/verify_retail_staticactor.py --input "${product}" \
            > "${safe_root}/retail-evidence-attestation.json" \
            2> "${private_root}/verifier.log"

          PRODUCT="${product}" MUTATED="${mutated}" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["PRODUCT"]).read_text(encoding="utf-8"))
          document["records"][0]["classPath"] = "/Mutation/Not/Approved"
          Path(os.environ["MUTATED"]).write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          set +e
          timeout 30s python tools/verify_retail_staticactor.py --input "${mutated}" \
            > "${private_root}/negative-attestation.json" \
            2> "${private_root}/negative-verifier.log"
          negative_status=$?
          set -e
          test "${negative_status}" -ne 0
          NEGATIVE="${private_root}/negative-attestation.json" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          import tools._schema_check as _schema_check

          document = json.loads(Path(os.environ["NEGATIVE"]).read_text(encoding="utf-8"))
          schema = _schema_check.load_schema(
              Path("schemas/retail-evidence-attestation.schema.json")
          )
          if document.get("result", {}).get("status") != "fail" or _schema_check.validate(document, schema):
              raise SystemExit("negative attestation failed schema check")
          PY

      - name: Create a sanitized failure attestation
        if: always() && !cancelled() && steps.analysis.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          safe_root="${GITHUB_WORKSPACE}/_safe"
          rm -rf -- "${safe_root}"
          mkdir -p "${safe_root}"
          set +e
          timeout 30s python tools/verify_retail_staticactor.py \
            --input "${RUNNER_TEMP}/retail-evidence-private/missing-product.json" \
            > "${safe_root}/retail-evidence-attestation.json" 2> /dev/null
          status=$?
          set -e
          test "${status}" -ne 0

      - name: Remove all private analysis material
        id: cleanup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP}/retail-evidence-private"

      - name: Validate the only retained file
        id: retained
        if: always() && !cancelled() && steps.cleanup.outcome == 'success' && hashFiles('_safe/retail-evidence-attestation.json') != ''
        shell: bash
        run: timeout 30s python tools/verify_retail_staticactor.py --validate-retained-output _safe

      - name: Upload the sanitized attestation
        if: always() && !cancelled() && steps.cleanup.outcome == 'success' && steps.retained.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retail-staticactor-attestation
          path: _safe/retail-evidence-attestation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Preserve a failed evidence result
        if: always() && !cancelled() && (steps.fetch.outcome != 'success' || steps.identity.outcome != 'success' || steps.analysis.outcome != 'success' || steps.cleanup.outcome != 'success' || steps.retained.outcome != 'success')
        shell: bash
        run: exit 1
