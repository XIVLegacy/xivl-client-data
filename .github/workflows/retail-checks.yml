name: Retail Checks

on:
  workflow_dispatch:

concurrency:
  group: retail-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retail-preflight:
    name: Retail Preflight Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      public_commit: ${{ steps.ref.outputs.public_commit }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Reject untrusted dispatch refs
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -z "${GITHUB_HEAD_REF:-}"
          test -z "${GITHUB_BASE_REF:-}"
          case "${GITHUB_REF}" in refs/pull/*|refs/merge/*) exit 1;; esac
          public_commit="$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "${public_commit}"
          remote_main="$(timeout 30s git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "${remote_main}"
          test "${remote_main}" = "${public_commit}"
          echo "public_commit=${public_commit}" >> "${GITHUB_OUTPUT}"

      - name: Verify the fixed public grant
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python tools/test_retail_staticactor.py
          timeout 120s python tools/test_retail_csv_corpus.py
          timeout 30s python tools/verify_retail_staticactor.py \
            > "${RUNNER_TEMP}/asset-free-attestation.json"
          timeout 30s python tools/verify_retail_csv_corpus.py --check-contract \
            > "${RUNNER_TEMP}/asset-free-csv-attestation.json"
          rm -f -- "${RUNNER_TEMP}/asset-free-attestation.json"
          rm -f -- "${RUNNER_TEMP}/asset-free-csv-attestation.json"

  staticactor:
    name: Static Actor Catalog Checks
    needs: retail-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: retail-evidence
    steps:
      - name: Checkout approved public commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.retail-preflight.outputs.public_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Fetch the immutable private SAN blob
        id: fetch
        continue-on-error: true
        uses: XIVLegacy/xivl-tools/.github/actions/fetch-retail-input@c15266b4be27ca7b60ad669921015e0746b2b162
        with:
          token: ${{ secrets.RETAIL_INPUTS_TOKEN }}
          commit: aeb52f6dbde95a793ee6d52be28de9f28a885b15
          path: client-data/ffxiv-1.23b/client/script/rq9q1797qvs.san
          size: 108911
          sha256: bb7306461b1728493242016a16d9dd5257d7512c60e423b017de5ec7aced3d14
          output-path: ${{ runner.temp }}/retail-evidence-private/game/client/script/rq9q1797qvs.san

      - name: Reproduce and verify static-actor catalog
        id: analysis
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_root="${RUNNER_TEMP}/retail-evidence-private"
          staging_root="${GITHUB_WORKSPACE}/_retail-staging"
          product="${private_root}/staticactor_class_paths.json"
          mutated="${private_root}/staticactor_class_paths-mutated.json"
          rm -rf -- "${staging_root}"
          mkdir -p "${staging_root}"

          timeout 120s python tools/extract_staticactor_san.py \
            "${private_root}/game" --out "${product}" \
            > "${private_root}/extract.log" 2>&1
          timeout 30s python tools/verify_retail_staticactor.py --input "${product}" \
            > "${staging_root}/retail-evidence-attestation.json" \
            2> "${private_root}/verifier.log"

          PRODUCT="${product}" MUTATED="${mutated}" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["PRODUCT"]).read_text(encoding="utf-8"))
          document["records"][0]["classPath"] = "/Mutation/Not/Approved"
          Path(os.environ["MUTATED"]).write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          set +e
          timeout 30s python tools/verify_retail_staticactor.py --input "${mutated}" \
            > "${private_root}/negative-attestation.json" \
            2> "${private_root}/negative-verifier.log"
          negative_status=$?
          set -e
          test "${negative_status}" -ne 0
          NEGATIVE="${private_root}/negative-attestation.json" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          import tools._schema_check as _schema_check

          document = json.loads(Path(os.environ["NEGATIVE"]).read_text(encoding="utf-8"))
          schema = _schema_check.load_schema(
              Path("schemas/retail-evidence-attestation.schema.json")
          )
          if document.get("result", {}).get("status") != "fail" or _schema_check.validate(document, schema):
              raise SystemExit("negative attestation failed schema check")
          PY

      - name: Create a sanitized failure attestation
        if: always() && !cancelled() && steps.analysis.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          staging_root="${GITHUB_WORKSPACE}/_retail-staging"
          rm -rf -- "${staging_root}"
          mkdir -p "${staging_root}"
          set +e
          timeout 30s python tools/verify_retail_staticactor.py \
            --input "${RUNNER_TEMP}/retail-evidence-private/missing-product.json" \
            > "${staging_root}/retail-evidence-attestation.json" 2> /dev/null
          status=$?
          set -e
          test "${status}" -ne 0

      - name: Finalize the retained retail attestation
        id: finalize
        if: always()
        continue-on-error: true
        uses: XIVLegacy/xivl-tools/.github/actions/finalize-retail-attestation@c15266b4be27ca7b60ad669921015e0746b2b162
        with:
          scratch-root: ${{ runner.temp }}/retail-evidence-private
          staging-root: ${{ github.workspace }}/_retail-staging

      - name: Validate the only retained file
        id: retained
        if: always() && !cancelled() && steps.finalize.outcome == 'success'
        shell: bash
        run: timeout 30s python tools/verify_retail_staticactor.py --validate-retained-output _retail-staging

      - name: Upload the sanitized attestation
        if: always() && !cancelled() && steps.finalize.outcome == 'success' && steps.retained.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retail-staticactor-attestation
          path: _retail-staging/retail-evidence-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve a failed evidence result
        if: always() && !cancelled() && (steps.fetch.outcome != 'success' || steps.analysis.outcome != 'success' || steps.finalize.outcome != 'success' || steps.retained.outcome != 'success')
        shell: bash
        run: exit 1

  csv-corpus:
    name: Decoded CSV Corpus Checks
    needs: retail-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: retail-evidence
    steps:
      - name: Checkout approved public commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.retail-preflight.outputs.public_commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Fetch the immutable private CSV archive
        id: fetch
        continue-on-error: true
        uses: XIVLegacy/xivl-tools/.github/actions/fetch-retail-input@c15266b4be27ca7b60ad669921015e0746b2b162
        with:
          token: ${{ secrets.RETAIL_INPUTS_TOKEN }}
          commit: db5f74e7480a162081820b2079f67bf0d6ddc5d4
          path: extracted/ffxiv-1.23b/client-data/csv.zip
          size: 70110686
          sha256: 006f9438a8cfd9277376f0ab28474500c67e4665050aa631cae64c9e6f38a5b0
          output-path: ${{ runner.temp }}/retail-csv-corpus/csv.zip

      - name: Verify and hydrate the complete CSV corpus
        id: analysis
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_root="${RUNNER_TEMP}/retail-csv-corpus"
          staging_root="${GITHUB_WORKSPACE}/_retail-staging"
          hydrated="${private_root}/csv"
          rm -rf -- "${staging_root}"
          mkdir -p "${staging_root}"

          timeout 120s python tools/verify_retail_csv_corpus.py \
            --archive "${private_root}/csv.zip" \
            > "${staging_root}/retail-evidence-attestation.json" \
            2> "${private_root}/verifier.log"
          timeout 120s python tools/private_csv_corpus.py hydrate \
            "${private_root}/csv.zip" "${hydrated}" \
            > "${private_root}/hydrate.log" 2>&1
          XIVL_CSV_DIR="${hydrated}" timeout 120s python tools/validate_corpus.py \
            > "${private_root}/validation.log" 2>&1

          printf 'not-the-approved-archive' > "${private_root}/mutated.zip"
          set +e
          timeout 30s python tools/verify_retail_csv_corpus.py \
            --archive "${private_root}/mutated.zip" \
            > "${private_root}/negative-attestation.json" \
            2> "${private_root}/negative-verifier.log"
          negative_status=$?
          set -e
          test "${negative_status}" -ne 0
          NEGATIVE="${private_root}/negative-attestation.json" timeout 30s python - <<'PY'
          import json
          import os
          from pathlib import Path

          import tools._schema_check as _schema_check

          document = json.loads(Path(os.environ["NEGATIVE"]).read_text(encoding="ascii"))
          schema = _schema_check.load_schema(
              Path("schemas/retail_csv_corpus_attestation.schema.json")
          )
          if document.get("result", {}).get("status") != "fail" or _schema_check.validate(document, schema):
              raise SystemExit("negative attestation failed schema check")
          PY

      - name: Create a sanitized failure attestation
        if: always() && !cancelled() && steps.analysis.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          staging_root="${GITHUB_WORKSPACE}/_retail-staging"
          rm -rf -- "${staging_root}"
          mkdir -p "${staging_root}"
          set +e
          timeout 30s python tools/verify_retail_csv_corpus.py \
            --archive "${RUNNER_TEMP}/retail-csv-corpus/missing.zip" \
            > "${staging_root}/retail-evidence-attestation.json" 2> /dev/null
          status=$?
          set -e
          test "${status}" -ne 0

      - name: Finalize the retained retail attestation
        id: finalize
        if: always()
        continue-on-error: true
        uses: XIVLegacy/xivl-tools/.github/actions/finalize-retail-attestation@c15266b4be27ca7b60ad669921015e0746b2b162
        with:
          scratch-root: ${{ runner.temp }}/retail-csv-corpus
          staging-root: ${{ github.workspace }}/_retail-staging

      - name: Validate the only retained file
        id: retained
        if: always() && !cancelled() && steps.finalize.outcome == 'success'
        shell: bash
        run: timeout 30s python tools/verify_retail_csv_corpus.py --validate-retained-output _retail-staging

      - name: Upload the sanitized attestation
        if: always() && !cancelled() && steps.finalize.outcome == 'success' && steps.retained.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retail-csv-corpus-attestation
          path: _retail-staging/retail-evidence-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve a failed evidence result
        if: always() && !cancelled() && (steps.fetch.outcome != 'success' || steps.analysis.outcome != 'success' || steps.finalize.outcome != 'success' || steps.retained.outcome != 'success')
        shell: bash
        run: exit 1
