name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Corpus Checks
    runs-on: ubuntu-latest
    env:
      XIVL_CORPUS_ABSENT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              before="${{ github.event.before }}"
              if test "${before}" = "0000000000000000000000000000000000000000"; then
                git diff-tree --check --root -m -r "${GITHUB_SHA}"
              else
                git diff --check "${before}..${GITHUB_SHA}"
              fi
              ;;
            workflow_dispatch)
              git diff-tree --check --root -m -r "${GITHUB_SHA}"
              ;;
            *)
              echo "unsupported event for whitespace check: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install jsonschema
      - name: Test retail static-actor contract
        run: python tools/test_retail_staticactor.py
      - name: Test actor appearance census
        run: python tools/test_actor_appearance_census.py
      - name: Test SubStat status join
        run: python tools/test_substat_status.py
      - name: Run strict gate
        run: python tools/validate_corpus.py
